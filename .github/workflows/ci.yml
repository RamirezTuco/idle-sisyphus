name: Check and deploy

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_needed: ${{ steps.changes.outputs.deploy_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Detect deployable changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" != "push" ]]; then
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- \
            public/ firebase.json package.json package-lock.json scripts/ \
            .github/workflows/ci.yml | grep -q .; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
          fi

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color

  deploy:
    name: Deploy Hosting
    needs: [site, terraform]
    if: >-
      needs.site.outputs.deploy_needed == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', vars.DEPLOY_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: firebase-hosting-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check deployment variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo "::error::Set GCP_PROJECT_ID"; exit 1; }
          test -n "$WIF_PROVIDER" || { echo "::error::Set WIF_PROVIDER"; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "::error::Set DEPLOY_SERVICE_ACCOUNT"; exit 1; }
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy checked commit
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEPLOY_BRANCH" --jq .object.sha)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping superseded commit $GITHUB_SHA; branch is at $latest_sha"
            exit 0
          fi
          npm exec -- firebase deploy --project "$GCP_PROJECT_ID" --only hosting --non-interactive
