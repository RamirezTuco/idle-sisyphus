name: Check and deploy

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_eligible: ${{ steps.deployment.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Determine deployment eligibility
        id: deployment
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
        run: node scripts/deployment-policy.js eligible

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color

  deploy:
    name: Deploy Hosting
    needs: [site, terraform]
    if: >-
      needs.site.outputs.deploy_eligible == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', vars.DEPLOY_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: firebase-hosting-${{ vars.GCP_PROJECT_ID || github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check current branch commit
        id: current
        env:
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEPLOY_BRANCH" --jq .object.sha)"
          LATEST_SHA="$latest_sha" node scripts/deployment-policy.js current
      - name: Check deployment variables
        if: steps.current.outputs.current == 'true'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo "::error::Set GCP_PROJECT_ID"; exit 1; }
          test -n "$WIF_PROVIDER" || { echo "::error::Set WIF_PROVIDER"; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "::error::Set DEPLOY_SERVICE_ACCOUNT"; exit 1; }
      - uses: google-github-actions/auth@v3
        if: steps.current.outputs.current == 'true'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy checked commit
        if: steps.current.outputs.current == 'true'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: npm exec -- firebase deploy --project "$GCP_PROJECT_ID" --only hosting --non-interactive
